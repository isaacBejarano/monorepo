name: Monorepo CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # job 1 - API
  ci-dotnet:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: Api/tests
    steps:
      - uses: actions/checkout@v5
      - name: CI .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.112"
          cache: true
          cache-dependency-path: "Api/**/*.csproj"
      - name: Restore dependencies
        run: dotnet restore Api/
      - name: Build API
        run: dotnet build Api/ --no-restore --configuration Release
      - name: Run xUnit Tests
        run: dotnet test Api/tests/ --no-build --configuration Release --verbosity normal
  # job 2 - App
  ci-angular:
    runs-on: ubuntu-26.04
    needs: ci-dotnet
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v5
      - name: CI Angular
        uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"
          cache: "npm"
          cache-dependency-path: App/package-lock.json
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
